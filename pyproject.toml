[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kycpseudo"
version = "0.1.0"
description = "Pseudonymise scanned KYC documents: replace personal details on the image with consistent, realistic stand-ins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amruth Ganta" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "pytesseract>=0.3.10",
  "rapidfuzz>=3",
  "cryptography>=41",
]

[project.optional-dependencies]
pdf = ["pypdfium2>=4"]
lama = ["simple-lama-inpainting>=0.1"]
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
kycpseudo = "kycpseudo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kycpseudo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end run on a small synthetic corpus (about a minute)"]
